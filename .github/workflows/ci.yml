name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Insider.slnx

      - name: Build
        run: dotnet build Insider.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Insider.Tests --configuration Release --no-build

      - name: CLI smoke test
        run: dotnet run --project src/Insider.Cli --configuration Release --no-build -- --help

  package-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build managed components
        run: dotnet build Insider.slnx --configuration Release

      - name: Configure native bootstrap
        run: cmake -S native -B artifacts/native-build -A x64

      - name: Build native bootstrap
        run: cmake --build artifacts/native-build --config Release

      - name: Publish CLI
        run: dotnet publish src/Insider.Cli --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=false --output artifacts/cli

      - name: Assemble package
        shell: pwsh
        run: >-
          ./eng/Build-WindowsPackage.ps1
          -NativeBootstrap artifacts/native-build/Insider.Bootstrap.Native/Release/version.dll
          -CliPublishDirectory artifacts/cli

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Insider-windows-x64
          path: artifacts/Insider-windows-x64
          if-no-files-found: error
