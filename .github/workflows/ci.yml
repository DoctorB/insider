name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Insider.slnx

      - name: Build
        run: dotnet build Insider.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Insider.Tests --configuration Release --no-build

      - name: CLI smoke test
        run: dotnet run --project src/Insider.Cli --configuration Release --no-build -- --help
